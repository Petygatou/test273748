<footer class="rodape" id="contato" data-rodape>
  <span class="rasgo rasgo--vira rodape__rasgo" aria-hidden="true"></span>

  <div class="mural" data-mural data-fecho>
    <div class="mural__chamada">
      <h2 class="mural__titulo"><span>Momentos de calma no</span><span>%marca:instagram%</span></h2>
      <button class="mural__toque" type="button" data-toque aria-label="Mostrar mais uma foto do mural">
        <svg viewBox="0 0 96 58" aria-hidden="true"><path class="mural__risco" d="M4 36c8-9 14-9 20 0s12 9 19-1c4-6 9-9 14-9"/><path class="mural__risco" d="M49 18l9 8-10 6"/><path class="mural__risco" d="M70 10l2-8M82 14l7-7M88 27l7-2"/></svg>
        <span>toca<br>aqui</span>
      </button>
    </div>
    <button class="mural__pilha" type="button" data-pilha aria-label="Ver a próxima foto do mural">
      <!-- @mural-pilha -->
    </button>
    <p class="so-leitor" role="status" aria-live="polite" data-pilha-status></p>
  </div>

  <div class="rodape__miolo">
    <div class="recado" data-recado>
      <div class="recado__retrato" aria-hidden="true">
        <svg viewBox="%caixa:deitado%"><use href="#capi-deitado"/></svg>
      </div>
      <div class="recado__conteudo">
        <h2 class="recado__titulo">Vem pra turma<br>da calma.</h2>
        <form class="recado__form" data-recado-form novalidate>
          <label class="so-leitor" for="recado-email">Seu e-mail</label>
          <input class="recado__campo" id="recado-email" type="email" name="email" placeholder="Seu e-mail ..." autocomplete="email" inputmode="email" required>
          <button class="recado__enviar" type="submit"><span>Enviar</span><span class="botao__seta" aria-hidden="true">›</span></button>
        </form>
        <p class="recado__aviso" role="status" aria-live="polite" data-recado-aviso></p>
      </div>
    </div>

    <div class="rodape__pe">
      <p class="rodape__linha"><span>%marca:razao%</span><span aria-hidden="true">|</span><span>%marca:cidade%</span><span aria-hidden="true">|</span><span>%marca:horario%</span></p>
      <div class="rodape__linha rodape__linha--2">
        <p>© 2026 %marca:nome%. Todos os direitos reservados.</p>
        <nav class="rodape__links" aria-label="Institucional"><a href="#privacidade">Privacidade</a><span aria-hidden="true">|</span><a href="#cookies">Cookies</a></nav>
        <nav class="rodape__redes" aria-label="Redes sociais">
          <a href="#instagram" aria-label="Instagram do Capiá"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5.2"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.3" cy="6.7" r=".9" class="cheio"/></svg></a>
          <a href="#whatsapp" aria-label="WhatsApp do Capiá"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.6l1.2-4.3A8.6 8.6 0 1 1 8 19.5z"/><path d="M9 8.4c-.5 1 .1 2.7 1.7 4.3s3.3 2.2 4.3 1.7"/></svg></a>
        </nav>
      </div>
    </div>
  </div>

  <p class="rodape__gigante" aria-hidden="true"><span>meu Capiá.</span> <span>minha calma.</span></p>

  <div class="mural__rastro" data-rastro aria-hidden="true"></div>
  <span class="mural__dica" data-dica aria-hidden="true">mexa o mouse</span>
</footer>
